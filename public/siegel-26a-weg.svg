<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Zertifiziert nach §26a WEG">
  <defs>
    <path id="circle-top" d="M 28 100 A 72 72 0 0 1 172 100"/>
    <path id="circle-bottom" d="M 28 100 A 72 72 0 0 0 172 100"/>
  </defs>

  <!-- Äußerer Ring -->
  <circle cx="100" cy="100" r="92" fill="#ffffff" stroke="#3F6A2C" stroke-width="3"/>
  <circle cx="100" cy="100" r="86" fill="none" stroke="#6BA63B" stroke-width="1.5"/>

  <!-- Innerer Kreis -->
  <circle cx="100" cy="100" r="62" fill="#6BA63B"/>
  <circle cx="100" cy="100" r="58" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Sterne als Trennzeichen oben -->
  <g fill="#3F6A2C">
    <circle cx="100" cy="14" r="2.5"/>
    <circle cx="100" cy="186" r="2.5"/>
  </g>

  <!-- Text oben: ZERTIFIZIERTE VERWALTUNG -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="14" font-weight="700" letter-spacing="2.5" fill="#3F6A2C">
    <textPath href="#circle-top" startOffset="50%" text-anchor="middle">
      ZERTIFIZIERTE VERWALTUNG
    </textPath>
  </text>

  <!-- Text unten: nach § 26a WEG -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="12" font-weight="600" letter-spacing="2" fill="#3F6A2C">
    <textPath href="#circle-bottom" startOffset="50%" text-anchor="middle">
      nach § 26a WEG
    </textPath>
  </text>

  <!-- Mittiges Element: stilisiertes H mit Schleife/Ribbon -->
  <g transform="translate(100 100)">
    <!-- Schleife oben (Ribbon) -->
    <path d="M -28 -22 L -10 -22 L -16 -10 L -28 -10 Z" fill="#3F6A2C"/>
    <path d="M  28 -22 L  10 -22 L  16 -10 L  28 -10 Z" fill="#3F6A2C"/>

    <!-- Medaillon -->
    <circle cx="0" cy="3" r="26" fill="#ffffff"/>
    <circle cx="0" cy="3" r="22" fill="none" stroke="#3F6A2C" stroke-width="1.5"/>

    <!-- H im Medaillon (italic) -->
    <g transform="skewX(-12)" fill="#3F6A2C">
      <rect x="-12" y="-12" width="5" height="30" rx="0.5"/>
      <rect x="7" y="-12" width="5" height="30" rx="0.5"/>
      <rect x="-12" y="-2" width="19" height="5"/>
    </g>
  </g>
</svg>
